<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Paws</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="min-h-screen overflow-hidden bg-[#10131b] text-[#f4f0e8]">
    <section id="playground" class="relative isolate flex min-h-screen items-center px-6 py-10 sm:px-12 lg:px-20">
      <div class="pixel-grid pointer-events-none absolute inset-0 -z-10"></div>
      <div class="mx-auto grid w-full max-w-6xl items-center gap-8 lg:grid-cols-2">
        <div class="max-w-xl">
          <p class="mb-6 font-pixel text-[9px] uppercase tracking-[.2em] text-[#ffb86b]">pixel paws / 001</p>
          <h1 class="font-display text-5xl font-bold leading-[.95] tracking-[-.06em] sm:text-7xl">
            Segui il tuo <span class="block text-[#ffb86b]">istinto.</span>
          </h1>
          <p class="mt-7 max-w-md text-lg leading-relaxed text-[#aeb3c2]">
            Muovi il mouse e guarda la curiosità del tuo piccolo compagno digitale prendere vita.
          </p>
          <p class="mt-9 font-pixel text-[9px] uppercase leading-5 text-[#777d8e]">muovi il cursore<br>per giocare →</p>
        </div>

        <div class="relative flex min-h-[430px] items-center justify-center sm:min-h-[560px]">
          <div class="absolute bottom-12 h-10 w-72 rounded-full bg-black/50 blur-xl sm:w-96"></div>
          <div id="cat" class="cat relative z-10 h-[280px] w-[280px] sm:h-[340px] sm:w-[340px]" aria-label="Gattino pixel art">
            <div class="ear ear-left"></div><div class="ear ear-right"></div>
            <div class="cat-head absolute inset-[14%] bg-[#ffb86b]">
              <div class="absolute left-[12%] top-[10%] h-3 w-12 bg-[#ffd59e]"></div>
              <div class="eye eye-left absolute left-[20%] top-[31%] h-12 w-12 bg-[#10131b] sm:h-14 sm:w-14">
                <i class="pupil absolute left-1/2 top-1/2 h-3 w-3 bg-[#b9f4d0]"></i><i class="glint absolute right-2 top-2 h-2 w-2 bg-white"></i>
              </div>
              <div class="eye eye-right absolute right-[20%] top-[31%] h-12 w-12 bg-[#10131b] sm:h-14 sm:w-14">
                <i class="pupil absolute left-1/2 top-1/2 h-3 w-3 bg-[#b9f4d0]"></i><i class="glint absolute right-2 top-2 h-2 w-2 bg-white"></i>
              </div>
              <div class="nose absolute left-1/2 top-[58%] h-4 w-5 -translate-x-1/2 bg-[#d87570]"></div>
              <div class="mouth absolute left-1/2 top-[65%] h-8 w-10 -translate-x-1/2 border-b-4 border-[#10131b]"></div>
              <div class="whisker absolute left-[-13%] top-[61%] h-1 w-[28%] bg-[#10131b]"></div>
              <div class="whisker absolute left-[-15%] top-[70%] h-1 w-[30%] bg-[#10131b]"></div>
              <div class="whisker absolute right-[-13%] top-[61%] h-1 w-[28%] bg-[#10131b]"></div>
              <div class="whisker absolute right-[-15%] top-[70%] h-1 w-[30%] bg-[#10131b]"></div>
            </div>
            <div class="absolute bottom-[10%] left-1/2 z-20 h-5 w-[52%] -translate-x-1/2 bg-[#7c6cff]"></div>
            <div class="absolute bottom-[7%] left-1/2 z-20 h-4 w-4 -translate-x-1/2 bg-[#ffe08a]"></div>
          </div>
          <p class="absolute bottom-0 font-pixel text-[8px] uppercase tracking-widest text-[#777d8e]">● attention detected</p>
        </div>
      </div>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
